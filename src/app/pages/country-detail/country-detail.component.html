@if (vm$ | async; as vm) {
  <app-dashboard-layout [titlePage]="vm.titlePage" [kpis]="vm.kpis">
    <div class="wrapper-container">
      <div class="container">
        <app-line-chart [data]="vm.countryMedalsByYears"></app-line-chart>
        <h2>Dates</h2>
      </div>
    </div>
    <div class="center">
      <button class="btn-back" (click)="goBack()">
        <span class="material-symbols-outlined">undo</span>
        Go back
      </button>
    </div>
  </app-dashboard-layout>
}
